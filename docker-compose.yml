services:
  eda-crm:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: "file:./data/dev.db"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-in-production}"
      CRON_SECRET: "${CRON_SECRET:-}"
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./deploy/docker-resolv.conf:/etc/resolv.conf:ro
    # 该机房封锁公共 DNS（223.5.5.5 等），且 Docker 内置 DNS(127.0.0.11) 不可用，直接挂载运营商 DNS
    dns:
      - 117.24.13.8
      - 110.80.137.52
    restart: unless-stopped
    command: sh -c "mkdir -p data uploads && node scripts/pre-migrate-backup.mjs && npx prisma migrate deploy && npm start"

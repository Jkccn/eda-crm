services:
  eda-crm:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: "file:./data/dev.db"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-in-production}"
      CRON_SECRET: "${CRON_SECRET:-}"
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    command: sh -c "mkdir -p data uploads && node scripts/pre-migrate-backup.mjs && npx prisma migrate deploy && npm start"
